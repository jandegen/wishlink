# Ready-to-run compose file attached to every release: `docker compose up -d` → http://localhost:3000
# The image reference is pinned to this release's version by the release pipeline.
services:
  wishlink:
    image: "@IMAGE@"
    restart: unless-stopped
    ports:
      - "${WISHLINK_PORT:-3000}:3000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Initial admin account (created on first start when ADMIN_PASSWORD is set)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional OIDC login (Keycloak); leave OIDC_ISSUER empty to disable
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-wishlink}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    volumes:
      - wishlink-data:/data

volumes:
  wishlink-data:
