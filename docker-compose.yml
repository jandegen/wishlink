# WishLink – runs the latest published release:  docker compose up -d   →  http://localhost:3000
#
#   Update to the newest release:  docker compose pull && docker compose up -d   (pull_policy: always also pulls on `up`)
#   Pin a version:                 WISHLINK_IMAGE=ghcr.io/jandegen/wishlink:1.2.3 docker compose up -d
#   Build from this checkout:      docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  wishlink:
    image: ${WISHLINK_IMAGE:-ghcr.io/jandegen/wishlink:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${WISHLINK_PORT:-3000}:3000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Set to true when running behind a reverse proxy that terminates TLS
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Initial admin account (created on first start if ADMIN_PASSWORD is set)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional OIDC login (Keycloak). Leave OIDC_ISSUER empty to disable.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-wishlink}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    volumes:
      - wishlink-data:/data

  # Optional local Keycloak for trying out OIDC: `docker compose --profile oidc up`
  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

volumes:
  wishlink-data:
